<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vocabulary Reader Assistant</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="left-actions" aria-label="Primary actions">
        <button id="startQuizBtn" class="btn" type="button">Take quiz</button>
        <label for="bookUpload" class="btn">Add book</label>
        <input id="bookUpload" class="file-input" type="file" accept=".txt,.epub" />
      </div>

      <div class="profile-actions" aria-label="Profile actions">
        <input id="profileNameInput" type="text" maxlength="40" placeholder="profile" />
        <button id="createProfileBtn" class="btn" type="button">Use profile</button>
        <button id="deleteProfileBtn" class="btn" type="button">Delete</button>
      </div>
    </header>

    <section id="onboardingBanner" class="hidden" aria-live="polite"></section>

    <section id="libraryView" class="library-screen">
      <div id="libraryList" class="book-list" aria-live="polite"></div>
    </section>

    <section id="librarySuggestions" class="hidden"></section>
    <p id="profilesText" class="hidden"></p>
    <p id="statusText" class="hidden"></p>

    <section id="profileView" class="hidden"></section>
    <section id="readerView" class="hidden"></section>
    <article id="readerSuggestions" class="hidden"></article>
    <div id="chapterNav" class="hidden"></div>
    <h2 id="readerBookTitle" class="hidden">No book open</h2>
    <p id="readerChapterTitle" class="hidden"></p>
    <div id="readerParagraphs" class="hidden"></div>
    <button id="suggestRemainingBtn" class="hidden" type="button">Suggest</button>
    <button id="toggleAssistBtn" class="hidden" type="button">Assist</button>
    <button id="goLibraryBtn" class="hidden" type="button">Library</button>
    <button id="goReaderBtn" class="hidden" type="button">Reader</button>
    <button id="goProfileBtn" class="hidden" type="button">Profile</button>
    <input id="quizCountInput" class="hidden" type="number" min="20" max="200" step="1" value="60" />
    <button id="exportProfileBtn" class="hidden" type="button">Export</button>
    <label for="importProfileInput" class="hidden">Import</label>
    <input id="importProfileInput" class="hidden" type="file" accept="application/json" />
    <section id="quizSection" class="hidden">
      <p id="quizProgress"></p>
      <div id="checklistWrap"></div>
      <button id="submitChecklistBtn" type="button">Next Batch</button>
    </section>
  </main>

  <script src="https://unpkg.com/compromise@14.15.0/builds/compromise.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
