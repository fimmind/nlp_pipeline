<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vocabulary Reader Assistant</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="left-actions" aria-label="Primary actions">
        <button id="startQuizBtn" class="btn" type="button">Take quiz</button>
        <label for="bookUpload" class="btn">Add book</label>
        <input id="bookUpload" class="file-input" type="file" accept=".txt,.epub" />
      </div>

      <div class="profile-actions" aria-label="Profile actions">
        <input id="profileNameInput" type="text" maxlength="40" placeholder="profile" />
        <button id="createProfileBtn" class="btn" type="button">Use profile</button>
        <button id="deleteProfileBtn" class="btn" type="button">Delete</button>
      </div>
    </header>

    <section id="onboardingBanner" class="hidden" aria-live="polite"></section>

    <section id="libraryView" class="screen library-screen">
      <div id="libraryList" class="book-list" aria-live="polite"></div>
      <article id="librarySuggestions" class="suggestions hidden"></article>
    </section>

    <section id="readerView" class="screen reader-screen hidden">
      <header class="reader-header">
        <button id="goLibraryBtn" class="btn" type="button">Back to library</button>
        <h2 id="readerBookTitle">No book open</h2>
      </header>
      <div class="reader-controls">
        <p id="readerChapterTitle"></p>
        <div class="reader-actions">
          <button id="suggestRemainingBtn" class="btn" type="button">Suggest from here</button>
          <button id="suggestNextBtn" class="btn" type="button">Suggest next chapter</button>
          <button id="suggestWholeReaderBtn" class="btn" type="button">Suggest whole book</button>
          <button id="toggleAssistBtn" class="btn" type="button">Assist: on</button>
        </div>
      </div>
      <nav id="chapterNav" class="chapter-nav" aria-label="Chapter navigation"></nav>
      <div id="readerParagraphs" class="reader-paragraphs"></div>
      <article id="readerSuggestions" class="suggestions hidden"></article>
    </section>

    <section id="profileView" class="screen profile-screen hidden">
      <p id="profilesText"></p>
      <div class="profile-row">
        <label for="quizCountInput">Quiz size</label>
        <input id="quizCountInput" type="number" min="20" max="200" step="1" value="60" />
        <button id="exportProfileBtn" class="btn" type="button">Export profile</button>
        <label for="importProfileInput" class="btn">Import profile</label>
        <input id="importProfileInput" class="file-input" type="file" accept="application/json" />
      </div>
      <section id="quizSection" class="quiz-section hidden">
        <p id="quizProgress"></p>
        <div id="checklistWrap"></div>
        <button id="submitChecklistBtn" class="btn" type="button">Next Batch</button>
      </section>
    </section>

    <p id="statusText" class="status" aria-live="polite"></p>
    <button id="goReaderBtn" class="hidden" type="button">Reader</button>
    <button id="goProfileBtn" class="hidden" type="button">Profile</button>
  </main>

  <script src="https://unpkg.com/compromise@14.15.0/builds/compromise.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
